<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Merry Christmas 🎄</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎄</text></svg>">
<style>
  html,body{margin:0;padding:0;height:100%;background:#141a28;overflow:hidden;-webkit-tap-highlight-color:transparent;}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;font-family:'Nunito',system-ui,-apple-system,sans-serif;}
  #nextBtn{position:absolute;left:50%;bottom:9.5vh;transform:translateX(-50%) translateY(14px);
    pointer-events:none;opacity:0;transition:opacity .7s ease,transform .7s ease;
    padding:15px 30px;border:0;border-radius:999px;cursor:pointer;
    background:linear-gradient(135deg,#ff8fab,#d94f76);color:#fff;
    font:700 17px 'Nunito',system-ui,sans-serif;letter-spacing:.3px;
    box-shadow:0 10px 30px rgba(217,79,118,.5);}
  #nextBtn.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  #nextBtn:active{transform:translateX(-50%) scale(.96);}
  #skip{position:absolute;right:16px;top:14px;pointer-events:none;opacity:0;transition:opacity .5s;
    padding:8px 15px;border:1px solid rgba(255,255,255,.3);border-radius:999px;cursor:pointer;
    background:rgba(255,255,255,.1);color:#eef2f8;font:600 13px 'Nunito',system-ui,sans-serif;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  #skip.show{opacity:.85;pointer-events:auto;}
  #fadeOut{position:fixed;inset:0;z-index:20;background:#fff8f6;opacity:0;pointer-events:none;transition:opacity .7s ease;}
  #fadeOut.on{opacity:1;}
  #muteBtn{position:absolute;left:16px;top:14px;pointer-events:none;opacity:0;transition:opacity .5s;
    width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);cursor:pointer;
    background:rgba(255,255,255,.1);font-size:17px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  #muteBtn.show{opacity:.85;pointer-events:auto;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fadeOut"></div>
<div id="ui">
  <button id="muteBtn" type="button" title="Tắt / bật nhạc">🔊</button>
  <button id="nextBtn" type="button">🎂 Vào tiệc sinh nhật</button>
</div>
<script>
'use strict';

var _q = new URLSearchParams(location.search);
var NEXT_PAGE = 'index1.html';
var NEXT_LABEL = '🎂 Vào tiệc sinh nhật';

var COLS = 124;
var cv = document.getElementById('c');
var ctx = cv.getContext('2d');
var off = document.createElement('canvas');
var octx = off.getContext('2d');
var bl = document.createElement('canvas');
var bctx = bl.getContext('2d');
var bl2 = document.createElement('canvas');
var b2ctx = bl2.getContext('2d');

var PW, W, H, CW, CH, ROWS, AR, DPR, SIZE, CX0, COLS_T, LEFT;

var chBuf, colBuf, dpBuf;

function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  PW = Math.min(W, H * 9 / 16);
  CW = PW / COLS;
  CH = CW * 1.62;
  AR = CW / CH;
  ROWS = Math.floor(H / CH);
  COLS_T = Math.ceil(W / CW);
  LEFT = Math.floor((COLS_T - COLS) / 2);
  SIZE = COLS_T * ROWS;
  chBuf = new Uint16Array(SIZE);
  colBuf = new Array(SIZE);
  dpBuf = new Float32Array(SIZE);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  off.width = cv.width; off.height = cv.height;
  bl.width = Math.max(1, Math.round(cv.width / 4));
  bl.height = Math.max(1, Math.round(cv.height / 4));
  bl2.width = Math.max(1, Math.round(cv.width / 10));
  bl2.height = Math.max(1, Math.round(cv.height / 10));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);
  octx.font = '700 ' + (CH * 0.95).toFixed(2) + 'px Menlo, Consolas, "DejaVu Sans Mono", monospace';
  octx.textAlign = 'center';
  octx.textBaseline = 'middle';
  CX0 = LEFT + COLS / 2;
  makeGrad();
}

var grad;
function makeGrad() {
  grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#04050a');
  grad.addColorStop(0.55, '#080b15');
  grad.addColorStop(0.86, '#0e1322');
  grad.addColorStop(1, '#141a28');
}

function put(x, y, ch, col, z) {
  x = x | 0; y = y | 0;
  if (x < 0 || x >= COLS_T || y < 0 || y >= ROWS) return;
  var i = y * COLS_T + x;
  if (chBuf[i] !== 0 && z < dpBuf[i]) return;
  chBuf[i] = ch.charCodeAt(0);
  colBuf[i] = col;
  dpBuf[i] = z;
}
function occupied(x, y) {
  x = x | 0; y = y | 0;
  if (x < 0 || x >= COLS_T || y < 0 || y >= ROWS) return true;
  return chBuf[y * COLS_T + x] !== 0;
}

/* ---------- random ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rnd = mulberry32(19871203);

function hash3(a, b, c) {
  var h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0;
  h = Math.imul(h ^ h >>> 13, 1274126177);
  return ((h ^ h >>> 16) >>> 0) / 4294967296;
}

/* ---------- easing ---------- */
function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
function at(t, s, d) { return clamp01((t - s) / d); }
function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }
function easeInOut15(v) {
  v = clamp01(v);
  return v < 0.5 ? Math.pow(2 * v, 1.5) / 2 : 1 - Math.pow(2 - 2 * v, 1.5) / 2;
}
function backOut(v) {
  v = clamp01(v);
  var s = 1.9;
  var p = v - 1;
  return 1 + p * p * ((s + 1) * p + s);
}

/* ---------- colour helpers ---------- */
var colCache = new Map();
function hsl(h, s, l) {
  h = h | 0; s = s | 0; l = l | 0;
  if (h < 0) h = 0; if (h > 360) h = 360;
  if (s < 0) s = 0; if (s > 100) s = 100;
  if (l < 0) l = 0; if (l > 100) l = 100;
  var k = (h * 101 + s) * 101 + l;
  var v = colCache.get(k);
  if (v === undefined) { v = 'hsl(' + h + ',' + s + '%,' + l + '%)'; colCache.set(k, v); }
  return v;
}
function rgba(r, g, b, a) {
  return 'rgba(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ',' + a.toFixed(2) + ')';
}

/* ---------- geometry constants ---------- */
var FLOOR_F = 0.845, BASE_F = 0.698, TIP_F = 0.273;
var MAXR = 0.37 * COLS;
var DISC_RX = 0.80 * COLS;

function rowFloor() { return FLOOR_F * ROWS; }
function rowBase() { return BASE_F * ROWS; }
function treeH() { return (BASE_F - TIP_F) * ROWS; }
function tilt() { return 0.17 * AR; }

/* ---------- tree point cloud ---------- */
var TIERS = 6;
var TR = [1.08, 0.80, 0.62, 0.46, 0.32, 0.19];
var TB = [0.00, 0.185, 0.355, 0.515, 0.665, 0.815];
var TT = [0.305, 0.465, 0.605, 0.735, 0.865, 1.0];
var LOBES = [13, 12, 10, 9, 7, 6];
var GLYPH = ['8', '&', '%', '#', '@'];

var NB = 24000;
var t_f = new Float32Array(NB), t_r = new Float32Array(NB), t_a = new Float32Array(NB);
var t_sh = new Float32Array(NB), t_dr = new Float32Array(NB);
var t_gl = new Uint8Array(NB), t_fr = new Uint8Array(NB), t_hj = new Float32Array(NB);
var t_rf = new Float32Array(NB), t_tier = new Uint8Array(NB);
var t_col = new Uint8Array(NB), t_hit = new Float32Array(NB);
var TREE_LIGHTS = [[354, 92], [46, 94], [212, 92], [286, 82], [328, 92], [186, 88], [0, 0], [120, 85]];
var SOUP_DARK = 'xv=o%', SOUP_MID = '&8#Wx%', SOUP_BRIGHT = '@MW0#o';

AR = 1 / 1.62;

var lobeLen = [], lobeBri = [], lobeDroop = [];
for (var ti = 0; ti < TIERS; ti++) {
  var L = LOBES[ti], ll = [], lb = [], ld = [];
  for (var k = 0; k < L; k++) {
    ll.push(0.70 + rnd() * 0.42);
    lb.push(0.82 + rnd() * 0.36);
    ld.push(0.6 + rnd() * 0.9);
  }
  lobeLen.push(ll); lobeBri.push(lb); lobeDroop.push(ld);
}

var LX = -0.80, LZ = 0.60;

function tierRadiusAt(ti, u) {
  return TR[ti] * MAXR * (1 - 0.70 * u * u * 0.9 - 0.10 * u);
}

(function buildTree() {
  var weights = [], tot = 0;
  for (var i = 0; i < TIERS; i++) { var w = TR[i] * TR[i] * (TT[i] - TB[i]); weights.push(w); tot += w; }
  var p = 0;
  for (var n = 0; n < NB; n++) {
    var pick = rnd() * tot, acc = 0, ti = 0;
    for (var j = 0; j < TIERS; j++) { acc += weights[j]; if (pick <= acc) { ti = j; break; } }
    var u = Math.pow(rnd(), 0.75);
    var f = TB[ti] + (TT[ti] - TB[ti]) * u;
    var a = rnd() * Math.PI * 2;
    var L = LOBES[ti];
    var li = Math.floor(a / (Math.PI * 2) * L) % L;
    var lfrac = (a / (Math.PI * 2) * L) % 1;
    var lobeShape = 0.74 + 0.26 * Math.sin(Math.PI * lfrac);
    var tierR = tierRadiusAt(ti, u);
    var core = rnd() < 0.30;
    var rf, ringB = 0;
    if (core) {
      rf = Math.pow(rnd(), 0.6) * 0.72;
    } else {
      var ring = Math.floor(rnd() * 4);
      ringB = (ring + 0.5) / 4;
      rf = Math.pow(rnd(), 0.42) * 0.99;
      rf = rf * 0.72 + ringB * 0.28;
    }
    rf = Math.min(rf, 1);
    var r = tierR * rf * lobeLen[ti][li] * lobeShape;
    var droop = Math.pow(rf, 2.1) * (2.0 + 4.6 * TR[ti]) * lobeDroop[ti][li] * AR * 3.2;

    var sh = 0.16 + 0.58 * Math.pow(rf, 1.15);
    sh *= lobeBri[ti][li];
    sh *= (0.30 + 0.70 * Math.pow(1 - u, 0.55));
    if (u > 0.55) sh *= 0.30 + 0.30 * (1 - (u - 0.55) / 0.45);
    if (core) sh *= 0.42;
    sh *= 0.80 + 0.40 * (0.5 + 0.5 * Math.sin(a * (10 + ti * 3) + li * 2.1));
    sh = Math.max(0.02, Math.min(1, sh));

    t_f[n] = f; t_r[n] = r; t_a[n] = a; t_sh[n] = sh; t_dr[n] = droop;
    t_rf[n] = rf; t_tier[n] = ti;
    t_hj[n] = (rnd() - 0.5) * 16;
    var frost = (rf > 0.80 && rnd() < 0.42 && Math.sin(a * 7 + li) > 0.1) ? 1 : 0;
    t_fr[n] = frost;
    p++;
  }
})();

/* ---------- lights ---------- */
var HUES = [318, 282, 228, 190, 150, 56, 38];
function rampHue(u) {
  u = u - Math.floor(u);
  var seq = HUES.length * 2 - 2;
  var x = u * seq;
  var i = Math.floor(x), fr = x - i;
  var ia = i < HUES.length ? i : seq - i;
  var ib = (i + 1) < HUES.length ? (i + 1) : seq - (i + 1);
  if (ia < 0) ia = 0; if (ib < 0) ib = 0;
  if (ia >= HUES.length) ia = HUES.length - 1;
  if (ib >= HUES.length) ib = HUES.length - 1;
  return HUES[ia] + (HUES[ib] - HUES[ia]) * fr;
}

var NL = 4200;
var l_f = new Float32Array(NL), l_r = new Float32Array(NL), l_a = new Float32Array(NL);
var l_h = new Float32Array(NL), l_g = new Uint8Array(NL), l_ph = new Float32Array(NL);
var l_on = new Uint8Array(NL);
var NLreal = 0;
(function buildLights() {
  for (var ti = 0; ti < TIERS; ti++) {
    var cnt = Math.round(NL * (TR[ti] / 3.47) * 0.92);
    for (var k = 0; k < cnt && NLreal < NL; k++) {
      var a = rnd() * Math.PI * 2;
      var seg = Math.floor(a / (Math.PI * 2) * 26);
      if (hash3(seg, ti, 7) < 0.26) continue;
      var u = 0.03 + rnd() * 0.10;
      var tierR = tierRadiusAt(ti, u);
      var gold = rnd() < 0.13;
      var rf = gold ? 0.80 + rnd() * 0.08 : 0.92 + rnd() * 0.08;
      var L = LOBES[ti];
      var li = Math.floor(a / (Math.PI * 2) * L) % L;
      var lfrac = (a / (Math.PI * 2) * L) % 1;
      var lobeShape = 0.74 + 0.26 * Math.sin(Math.PI * lfrac);
      var r = tierR * rf * lobeLen[ti][li] * lobeShape;
      var droop = Math.pow(rf, 2.1) * (2.0 + 4.6 * TR[ti]) * lobeDroop[ti][li] * AR * 3.2;
      l_f[NLreal] = TB[ti] + (TT[ti] - TB[ti]) * u;
      l_r[NLreal] = r;
      l_a[NLreal] = a;
      l_h[NLreal] = gold ? 42 : rampHue(a / (Math.PI * 2));
      l_g[NLreal] = gold ? 1 : 0;
      l_ph[NLreal] = rnd() * Math.PI * 2;
      NLreal++;
    }
  }
})();

/* ---------- baubles ---------- */
var baubles = [];
var BAUBLE_COLS = [[354, 82, 42], [44, 70, 50], [208, 80, 50], [322, 78, 56], [278, 60, 52], [190, 70, 48], [0, 0, 70]];
(function buildBaubles() {
  for (var ti = 0; ti < TIERS; ti++) {
    var n = 7 + Math.floor(rnd() * 4) - Math.floor(ti * 0.8);
    for (var k = 0; k < n; k++) {
      var a = rnd() * Math.PI * 2;
      var u = k % 3 === 0 ? 0.25 + rnd() * 0.3 : 0.02 + rnd() * 0.08;
      var tierR = tierRadiusAt(ti, u);
      var L = LOBES[ti];
      var li = Math.floor(a / (Math.PI * 2) * L) % L;
      var rf = 0.72 + rnd() * 0.18;
      var r = tierR * rf * lobeLen[ti][li];
      var droop = Math.pow(rf, 2.1) * (2.0 + 4.6 * TR[ti]) * lobeDroop[ti][li] * AR * 3.2;
      var pal = BAUBLE_COLS[Math.floor(rnd() * BAUBLE_COLS.length)];
      baubles.push({ f: TB[ti] + (TT[ti] - TB[ti]) * u, r: r * (u > 0.2 ? 1.04 : 1), a: a, dr: droop + 2.2, l: pal[2] + rnd() * 10, h: pal[0], s: pal[1], big: rnd() < 0.35 });
    }
  }
})();

/* ---------- gifts ---------- */
var GIFT_DEF = [
  { w: 9.5, h: 7.0, d: 9.5, box: [354, 74], rib: 44, dist: 0.95, ang: 0.35 },
  { w: 6.0, h: 5.0, d: 6.0, box: [44, 62], rib: 354, dist: 1.08, ang: 1.62 },
  { w: 12.0, h: 4.4, d: 7.5, box: [150, 54], rib: 44, dist: 0.90, ang: 2.88 },
  { w: 5.2, h: 10.0, d: 5.2, box: [212, 62], rib: 44, dist: 1.05, ang: 4.05 },
  { w: 8.0, h: 6.0, d: 8.0, box: [312, 62], rib: 44, dist: 0.98, ang: 5.25 }
];
var gifts = [];
(function buildGifts() {
  for (var gi = 0; gi < GIFT_DEF.length; gi++) {
    var d = GIFT_DEF[gi];
    var n = 2400;
    var px = new Float32Array(n), py = new Float32Array(n), pz = new Float32Array(n);
    var ps = new Float32Array(n), pg = new Uint8Array(n), pr = new Uint8Array(n);
    for (var i = 0; i < n; i++) {
      var face = rnd();
      var x, y, z, nx = 0, ny = 0, nz = 0;
      if (face < 0.22) { x = -d.w / 2; y = rnd() * d.h; z = (rnd() - 0.5) * d.d; nx = -1; }
      else if (face < 0.44) { x = d.w / 2; y = rnd() * d.h; z = (rnd() - 0.5) * d.d; nx = 1; }
      else if (face < 0.60) { z = -d.d / 2; y = rnd() * d.h; x = (rnd() - 0.5) * d.w; nz = -1; }
      else if (face < 0.76) { z = d.d / 2; y = rnd() * d.h; x = (rnd() - 0.5) * d.w; nz = 1; }
      else { y = d.h; x = (rnd() - 0.5) * d.w; z = (rnd() - 0.5) * d.d; ny = 1; }
      var ribbon = 0;
      if (ny === 1) { if (Math.abs(x) < d.w * 0.09 || Math.abs(z) < d.d * 0.09) ribbon = 1; }
      else if (nx !== 0) { if (Math.abs(z) < d.d * 0.09) ribbon = 1; }
      else { if (Math.abs(x) < d.w * 0.09) ribbon = 1; }
      if (i > n - 170) {
        var ba = rnd() * Math.PI * 2, brr = 0.9 + rnd() * 0.9;
        x = Math.cos(ba) * brr + (rnd() - 0.5) * 0.4;
        z = Math.sin(ba) * brr * 0.6;
        y = d.h + 0.7 + Math.abs(Math.sin(ba)) * 0.9;
        ribbon = 1; ny = 1;
      }
      px[i] = x; py[i] = y; pz[i] = z;
      ps[i] = ny === 1 ? 1.0 : (nx !== 0 ? (nx < 0 ? 0.92 : 0.22) : (nz > 0 ? 0.62 : 0.16));
      pr[i] = ribbon;
      pg[i] = Math.floor(rnd() * 5);
    }
    gifts.push({ d: d, n: n, px: px, py: py, pz: pz, ps: ps, pr: pr, pg: pg });
  }
})();


/* ---------- người tuyết đi từ ngoài vào, đứng cạnh cây và vẫy tay ---------- */
var SM_T0 = 12.0, SM_WALK = 2.3;
var SM = null;
function buildSnowman() {
  var X = [], Y = [], Z = [], NX = [], NY = [], NZ = [], K = [];
  function push(x, y, z, nx, ny, nz, k) { X.push(x); Y.push(y); Z.push(z); NX.push(nx); NY.push(ny); NZ.push(nz); K.push(k); }
  function sph(n, cx, cy, cz, r, k) {
    for (var i = 0; i < n; i++) {
      var a = rnd() * 2 - 1, b = rnd() * Math.PI * 2, q = Math.sqrt(1 - a * a);
      var nx = q * Math.cos(b), ny = a, nz = q * Math.sin(b);
      push(cx + nx * r, cy + ny * r, cz + nz * r, nx, ny, nz, k);
    }
  }
  function tube(n, r0, r1, y0, y1, k, cap) {
    for (var i = 0; i < n; i++) {
      var a = rnd() * Math.PI * 2;
      if (cap && rnd() < 0.25) {
        var rr = r1 * Math.sqrt(rnd());
        push(Math.cos(a) * rr, y1, Math.sin(a) * rr, 0, 1, 0, k);
        continue;
      }
      var f = rnd(), r = r0 + (r1 - r0) * f;
      push(Math.cos(a) * r, y0 + (y1 - y0) * f, Math.sin(a) * r, Math.cos(a), 0, Math.sin(a), k);
    }
  }
  sph(2200, 0, 0.55, 0, 0.56, 0);
  sph(1600, 0, 1.33, 0, 0.41, 0);
  sph(1200, 0, 1.97, 0, 0.30, 0);
  tube(500, 0.27, 0.27, 2.17, 2.19, 4);
  tube(700, 0.17, 0.165, 2.19, 2.56, 4, true);
  tube(900, 0.33, 0.30, 1.64, 1.76, 3);
  for (var i = 0; i < 160; i++) {
    var f = rnd(), a = rnd() * Math.PI * 2, r = 0.055 * (1 - f);
    push(Math.cos(a) * r, 1.95 + Math.sin(a) * r, 0.28 + f * 0.30, Math.cos(a), Math.sin(a), 0, 2);
  }
  var coal = [[-0.105, 2.05, 0.265, 0.045], [0.105, 2.05, 0.265, 0.045],
  [0, 1.46, 0.39, 0.05], [0, 1.30, 0.41, 0.052], [0, 1.13, 0.385, 0.05]];
  for (var s = 0; s < 6; s++) {
    var aa = -0.85 + 1.7 * s / 5;
    coal.push([0.14 * Math.sin(aa), 1.86 - 0.045 * Math.cos(aa), 0.27 - 0.03 * Math.abs(Math.sin(aa)), 0.026]);
  }
  for (var c = 0; c < coal.length; c++) sph(c < 2 ? 70 : 45, coal[c][0], coal[c][1], coal[c][2], coal[c][3], 1);
  SM = {
    n: X.length, x: new Float32Array(X), y: new Float32Array(Y), z: new Float32Array(Z),
    nx: new Float32Array(NX), ny: new Float32Array(NY), nz: new Float32Array(NZ), k: new Uint8Array(K)
  };
}
buildSnowman();

var SM_RAMP = '.:-=+*#%@';
function drawSnowman(t) {
  if (t < SM_T0) return;
  var S = 22 * (PW / COLS) / CW;
  var tw = clamp01((t - SM_T0) / SM_WALK);
  var e = 1 - Math.pow(1 - tw, 2);
  var startX = COLS_T + 16, endX = CX0 + 40;
  var sx = startX + (endX - startX) * e;
  var walking = tw < 1;
  var stepPh = (t - SM_T0) * 2.1;

/* ================= AUDIO ================= */
var AC = null, bus = null, master = null, started = false;

  var dry = AC.createGain(); dry.gain.value = 0.85;
  var wet = AC.createGain(); wet.gain.value = 0.32;
  var conv = AC.createConvolver();

  var ir = AC.createBuffer(2, len, AC.sampleRate);
  for (var c = 0; c < 2; c++) {
    var dat = ir.getChannelData(c);
    for (var i = 0; i < len; i++) {
      var k = 1 - i / len;
      dat[i] = (Math.random() * 2 - 1) * k * k * k;
    }
  }
  conv.buffer = ir;
  var comp = AC.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 4;
  master = AC.createGain(); master.gain.value = 1.3;
  bus.connect(dry); dry.connect(comp);
  bus.connect(conv); conv.connect(wet); wet.connect(comp);
  comp.connect(master); master.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate * 2), AC.sampleRate);
  var nd = noiseBuf.getChannelData(0);
  for (var i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

var noiseBuf = null;

}

function noise(f0, f1, q, dur, vol, pan, delay, type) {

function drawSnow(t) {

function drawFallingLight(t) {
  var p = at(t, 0.05, 0.34);
  if (p <= 0 || t > 0.46) return;
  var e = p * p;
  var y0 = -4, y1 = rowFloor();
  var y = y0 + (y1 - y0) * e;

function discPattern(rr, aa) {
  if (rr > 0.955 && rr < 1.0) return 1;
  if (rr > 0.898 && rr < 0.928) return 1;
  if (rr > 0.62 && rr < 0.885) {
    var band = (rr - 0.62) / 0.265;
    var pet = Math.sin(16 * aa);
    if (pet > 0.30 + 1.45 * Math.abs(band - 0.5)) return 1;
    if (Math.abs(pet) > 0.9985) return 1;
  }
  if (rr > 0.555 && rr < 0.60) return 1;
  if (rr > 0.22 && rr < 0.545 && Math.abs(Math.sin(4 * aa)) > 0.955) return 1;
  if (rr > 0.155 && rr < 0.19) return 1;
  return 0;
}

function drawDisc(t, rot) {
  var g = at(t, 0.39, 1.0);
  if (g <= 0) return;
  var sp = smooth(g);
  var cx = CX0, cy = rowFloor();
  var rx = DISC_RX, ry = DISC_RX * AR * 0.28;
  var impact = at(t, 0.39, 1.0);
  var x0 = Math.max(0, Math.floor(cx - rx)), x1 = Math.min(COLS_T - 1, Math.ceil(cx + rx));
  var y0 = Math.max(0, Math.floor(cy - ry - 1)), y1 = Math.min(ROWS - 1, Math.ceil(cy + ry + 1));
  var sweepA = t * 0.9;
  var pulse = ((t - 1.4) * 0.55) % 1.6;
  for (var y = y0; y <= y1; y++) {
    for (var x = x0; x <= x1; x++) {
      var dx = (x - cx) / rx, dy = (y - cy) / ry;
      var d2 = dx * dx + dy * dy;
      if (d2 > 1) continue;
      var rr = Math.sqrt(d2);
      if (rr > sp * 1.001) continue;
      var aa = Math.atan2(dy, dx) + rot;
      var pat = discPattern(rr, aa);
      var lead = 1 - Math.min(1, (sp - rr) / 0.09);
      var sw = Math.max(0, Math.cos(aa - sweepA)) ;
      sw = Math.pow(sw, 14) * 0.5;
      var pl = Math.exp(-Math.pow((rr - pulse) / 0.06, 2)) * 0.35;
      var li, ch;
      if (pat) {
        li = 50 + 10 * (0.5 + 0.5 * Math.sin(aa * 3 + t)) + lead * 18 + sw * 14 + pl * 20;
        ch = rr > 0.9 ? '#' : (Math.abs(Math.sin(4 * aa)) > 0.955 && rr < 0.55 ? '=' : '+');
      } else {
        if (hash3(x, y, 3) > 0.55) continue;
        li = 13 + 7 * hash3(x, y, 5) + lead * 18 + sw * 10 + pl * 13;
        ch = '-';
      }
      var sat = 30 + 16 * (pat ? 1 : 0.35) + lead * 8;

      var rt = at(t, 0.41 + k * 0.07, 0.75);

        var xx = cx + Math.cos(ang) * rr2 * rx;
        var yy = cy + Math.sin(ang) * rr2 * ry;

      }
    }
    var sp2 = at(t, 0.40, 1.0);
    if (sp2 < 1) {
      for (var s = 0; s < 80; s++) {
        var ang = hash3(s, 1, 2) * Math.PI * 2;
        var spd = 0.3 + hash3(s, 2, 3) * 0.75;
        var pr = sp2 * spd;

    }
  }

function drawRing(t, rot, F) {

/* ---------- reindeer ---------- */
function sdSeg(px, py, ax, ay, bx, by, ra, rb) {
  var bax = bx - ax, bay = by - ay;
  var pax = px - ax, pay = py - ay;
  var h = clamp01((pax * bax + pay * bay) / (bax * bax + bay * bay + 1e-6));

}

  var x = dx * c - dy * s, y = dx * s + dy * c;
  var k = Math.sqrt((x / rx) * (x / rx) + (y / ry) * (y / ry));
  return (k - 1) * Math.min(rx, ry);
}

  var x = (ph % 1 + 1) % 1 * 4;

  var a = poses[i % 4], b = poses[(i + 1) % 4];
  return [a[0] + (b[0] - a[0]) * fr, a[1] + (b[1] - a[1]) * fr];
}
function deerSDF(lx, ly, t) {
  var stride = t * 1.0;
  var bob = Math.sin(stride * Math.PI * 2 * 2) * 0.5;
  ly -= bob;
  var d = 1e9;
  d = Math.min(d, sdEll(lx, ly, -5.6, -0.2, 4.9, 3.5, 0.12));
  d = Math.min(d, sdEll(lx, ly, -0.6, 1.0, 6.6, 2.5, 0.02));

  d = Math.min(d, sdSeg(lx, ly, 6.6, -1.8, 9.6, -5.4 + hn, 2.0, 1.45));
  d = Math.min(d, sdEll(lx, ly, 11.0, -6.6 + hn, 2.6, 1.7, -0.36));
  d = Math.min(d, sdSeg(lx, ly, 12.3, -6.3 + hn, 14.9, -5.6 + hn, 1.05, 0.62));
  d = Math.min(d, sdSeg(lx, ly, 10.2, -8.0 + hn, 11.1, -10.0 + hn, 0.66, 0.34));

    d = Math.min(d, sdSeg(lx, ly, ax0 + s * 0.35, ay0, tipx, tipy, 0.55, 0.3));
    d = Math.min(d, sdSeg(lx, ly, ax0 + s * 0.35 + 0.25, ay0 - 1.9, tipx - 2.3, tipy + 1.2, 0.36, 0.22));
    d = Math.min(d, sdSeg(lx, ly, ax0 + s * 0.35 + 0.5, ay0 - 3.7, tipx + 1.9, tipy + 1.9, 0.36, 0.22));
    d = Math.min(d, sdSeg(lx, ly, tipx - 0.15, tipy + 1.4, tipx + 1.4, tipy - 1.2, 0.34, 0.2));
  }
  var tw = Math.sin(stride * Math.PI * 2 * 2) * 0.6;
  d = Math.min(d, sdSeg(lx, ly, -9.4, -1.2, -11.6, -3.6 + tw, 0.9, 0.42));
  var legs = [[4.6, 2.2, 0.0], [3.6, 2.2, 0.5], [-5.4, 2.0, 0.5], [-6.4, 2.0, 0.0]];
  for (var i = 0; i < 4; i++) {
    var L = legs[i];

  }
  return d;
}

function ensureAux() {
  if (chA && chA.length === SIZE) return;
  chA = new Uint16Array(SIZE); colA = new Array(SIZE); dpA = new Float32Array(SIZE); dissThr = new Float32Array(SIZE);
  for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS_T; x++) {
    var dx = (x - CX0) / (COLS_T * 0.5), dy = (y - ROWS * 0.5) / (ROWS * 0.5);
    dissThr[y * COLS_T + x] = 0.5 * hash3(x, y, 91) + 0.5 * Math.min(1, Math.sqrt(dx * dx + dy * dy));
  }
}
function clearBuf() { chBuf.fill(0); dpBuf.fill(-1e9); }
function drawTreeScene(t) {
  var rot = t * 0.5;
  var g = clamp01((t - 1.8) / 4.35);
  var F = easeInOut15(g) * 1.12;
  drawStars(t);
  drawMoon(t);
  drawFallingLight(t);
  drawDisc(t, rot);
  drawTrunk(t);
  var deerOn = t >= 10.55;
  var deerInfo = { x: CX0, y: rowBase() - 0.20 * treeH() - 3, sc: 1.35 };
  drawTree(t, rot, F, deerInfo.x, deerInfo.y, deerOn);
  drawRing(t, rot, F);
  drawDust(t, rot, F);
  drawStar(t);
  drawLights(t, rot, deerInfo);
  drawGarland(t, rot, deerOn, deerInfo);
  drawGifts(t, rot);
  drawDeer(t, deerInfo);
  drawSnowman(t);
  drawFireworks(t);
  drawSleigh(t);
  drawSnowballs(t);
  drawGreeting(t);
  drawHB(t);
}
function render(mode, a, b, p) {
  ensureAux();
  clearBuf();
  if (mode === 'play') { drawSnow(a); drawStars(a); drawPlay(a); }
  else if (mode === 'intro') { drawSnow(a); drawFinale(a); }
  else if (mode === 'tree') { drawSnow(b); drawTreeScene(b); }
  else {
    drawSnow(b); drawFinale(a);
    chA.set(chBuf); dpA.set(dpBuf);
    for (var i = 0; i < SIZE; i++) colA[i] = colBuf[i];
    clearBuf(); drawSnow(b); drawTreeScene(b);
    var gold = hsl(46, 90, 82);
    for (var j = 0; j < SIZE; j++) {
      var th = dissThr[j];
      if (th > p) { chBuf[j] = chA[j]; colBuf[j] = colA[j]; dpBuf[j] = dpA[j]; }
      else if (th > p - 0.045) { chBuf[j] = 42; colBuf[j] = gold; }
    }
  }
  composite();
}
function composite() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  octx.setTransform(DPR, 0, 0, DPR, 0, 0);
  octx.clearRect(0, 0, W, H);
  octx.font = '700 ' + (CH * 0.95).toFixed(2) + 'px Menlo, Consolas, "DejaVu Sans Mono", monospace';
  octx.textAlign = 'center'; octx.textBaseline = 'middle';
  var xoff = (W - COLS_T * CW) / 2;
  var last = null;
  for (var y = 0; y < ROWS; y++) {
    var row = y * COLS_T;
    var py = y * CH + CH * 0.5;
    for (var x = 0; x < COLS_T; x++) {
      var i = row + x;
      var code = chBuf[i];
      if (code === 0) continue;
      var col = colBuf[i];
      if (col !== last) { octx.fillStyle = col; last = col; }
      octx.fillText(String.fromCharCode(code), xoff + x * CW + CW * 0.5, py);
    }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.filter = 'none';
  ctx.drawImage(off, 0, 0);
  bctx.setTransform(1, 0, 0, 1, 0, 0);
  bctx.clearRect(0, 0, bl.width, bl.height);
  bctx.filter = 'blur(' + Math.max(0.8, PW * 0.006 * DPR / 4).toFixed(1) + 'px)';
  bctx.drawImage(off, 0, 0, bl.width, bl.height);
  b2ctx.setTransform(1, 0, 0, 1, 0, 0);
  b2ctx.clearRect(0, 0, bl2.width, bl2.height);
  b2ctx.filter = 'blur(' + Math.max(0.8, PW * 0.02 * DPR / 10).toFixed(1) + 'px)';
  b2ctx.drawImage(off, 0, 0, bl2.width, bl2.height);
  ctx.globalCompositeOperation = 'screen';
  ctx.filter = 'none';
  ctx.globalAlpha = 0.5;
  ctx.drawImage(bl, 0, 0, cv.width, cv.height);
  ctx.globalAlpha = 0.24;
  ctx.drawImage(bl2, 0, 0, cv.width, cv.height);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ================= TIMELINE / LOOP ================= */
var t0 = 0, paused = false, pauseAt = 0, prevT = 0, finished = false;
var nextBtn = document.getElementById('nextBtn');
var skipBtn = null;
var muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if (master) master.gain.value = muted ? 0 : 1.3;
});
nextBtn.textContent = NEXT_LABEL;

function sound(tp, t) {
  scheduleMusic(t);
  cue('music', 0.42, tp, t, startMusic);
  if (t >= FW_T0) {
    var lastFw = Math.floor((Math.min(t, HB_T0 + 0.6) - FW_T0) / FW_GAP);
    for (var fi = Math.max(0, lastFw - 2); fi <= lastFw; fi++) {
      (function (fi) {
        var fw = fwInfo(fi);
        cue('fwL' + fi, fw.launch, tp, t, function () { glide(500, 1700, FW_RISE * 0.9, 0.025, 'sine'); });
        cue('fwB' + fi, fw.burst, tp, t, function () {
          var pan = (fw.x - CX0) / (COLS * 0.5);
          glide(110, 38, 0.5, 0.18, 'sine');
          noise(900, 160, 0.8, 0.7, 0.10, Math.max(-0.9, Math.min(0.9, pan)));
          noise(5200, 3000, 1.5, 1.1, 0.03, -pan * 0.5, 0.18);
        });
      })(fi);
    }
  }
  var slt = sleighPass(t);
  if (slt >= 0) {
    var sstep = Math.floor(slt / 0.3);
    var skey = 'sl' + Math.floor((t - SLEIGH_T0) / SLEIGH_EVERY) + '_' + sstep;
    if (!fired[skey]) { fired[skey] = true; if (ready()) sleigh(0, 0.05); }
  }
  cue('drop', 0.05, tp, t, function () {
    glide(2400, 620, 0.34, 0.14, 'sine');
    bell(note(12), 1.2, 0.18, 0);
  });
  cue('land', 0.39, tp, t, function () {
    glide(120, 44, 0.5, 0.5, 'sine');
    noise(300, 2600, 0.9, 1.2, 0.10, 0);
    bell(note(-5), 3.4, 0.22, -0.3);
    bell(note(-3), 3.2, 0.18, 0.3);
    bell(note(10), 0.8, 0.09, -0.4, 0.26);
    bell(note(12), 0.8, 0.09, 0.1, 0.39);
    bell(note(14), 0.9, 0.09, 0.4, 0.52);
  });
  cue('trunk', 1.05, tp, t, function () {
    for (var i = 0; i < 6; i++) {
      glide(150 + i * 26, 90 + i * 20, 0.07, 0.16, 'triangle', i * 0.072);
      noise(900 + i * 120, 600, 3, 0.05, 0.05, (i % 2 ? 0.2 : -0.2), i * 0.072);
    }
  });
  cue('ring', 1.2, tp, t, function () {
    noise(400, 3200, 1.2, 0.6, 0.11, 0);
    glide(330, 990, 0.6, 0.09, 'sine');
    bell(note(7), 1.6, 0.14, 0, 0.58);
  });
  if (t >= 1.8 && t <= 5.5) {
    if (!fired.leafbed) { fired.leafbed = true; startLeafBed(); }
    var gg = clamp01((t - 1.8) / 3.6);
    var step = Math.floor(gg * 40);
    if (step > growStep) {
      growStep = step;
      if (ready() && Math.random() < 0.75) {
        bell(note(10 + Math.floor(Math.random() * 10)), 0.9, 0.035, (Math.random() - 0.5) * 1.6);
      }
    }
    var st2 = Math.floor((t - 1.8) * 7);
    if (st2 > leafStep) {
      leafStep = st2;
      if (ready() && Math.random() < 0.6) noise(2600 + Math.random() * 3600, 2200, 4, 0.06, 0.012, (Math.random() - 0.5) * 1.6);
    }
  }
  cue('star', 5.27, tp, t, function () {
    for (var i = 0; i < 5; i++) bell(note(7 + i * 2), 0.6, 0.10, 0, i * 0.065);
    var ch = [7, 9, 12, 14];
    for (var i = 0; i < 4; i++) bell(note(ch[i]), 2.6, 0.13, i % 2 ? 0.6 : -0.6, 0.38);
    noise(5000, 8000, 1.4, 1.6, 0.045, 0, 0.38);
  });
  cue('comet', 5.95, tp, t, function () {
    noise(3600, 500, 1.1, 0.9, 0.10, 0);
    for (var i = 0; i < 24; i++) {
      bell(note(16 - i), 0.8, 0.075, i % 2 ? 0.85 : -0.85, i * (3.0 / 24));
    }
  });
  cue('lit', 8.95, tp, t, function () {
    var ch = [-5, -3, 0, 2];
    for (var i = 0; i < 4; i++) pad(note(ch[i]), 3.0, 0.075, i % 2 ? 0.35 : -0.35);
    bell(note(7), 2.4, 0.12, 0);
  });
  for (var i = 0; i < 5; i++) {
    (function (i) {
      cue('gift' + i, 9.05 + i * 0.26, tp, t, function () {
        var f0 = 300 + i * 40;
        glide(f0, f0 * 3.2, 0.075, 0.13, 'sine');
        noise(1400, 900, 3, 0.05, 0.05, 0);
        bell(note(5 + i * 2), 1.1, 0.10, (i - 2) * 0.35, 0.09);
      });
    })(i);
  }
  if (t >= SM_T0 && t < SM_T0 + SM_WALK) {
    var stepN = Math.floor((t - SM_T0) * 4.2);
    if (stepN > smStep) {
      smStep = stepN;
      if (ready()) noise(1500 + Math.random() * 600, 700, 2.2, 0.09, 0.07, 0.4 + Math.random() * 0.3);
    }
  }
  cue('hello', SM_T0 + SM_WALK + 0.15, tp, t, function () {
    bell(note(7), 0.9, 0.12, 0.45);
    bell(note(9), 0.9, 0.12, 0.5, 0.16);
    bell(note(12), 1.6, 0.14, 0.55, 0.32);
  });
  cue('deer', 10.55, tp, t, function () {
    for (var i = 0; i < 7; i++) bell(note(4 + i * 2), 0.9, 0.09, -0.8 + i * 0.27, i * 0.085);
    for (var i = 0; i < 8; i++) sleigh(0.62 + i * 0.17, 0.11 * (1 - i / 10));
  });
}

var clock = 0, lastNow = 0, phase = 'play', introT0 = 0, treeT0 = 0, outT0 = 0;
var prevIntroT = -1, prevTreeT = -1, musicHold = false, outGone = false;
var INTRO_END = 8.3, DISSOLVE = 1.7;
function frame() {
  var now = performance.now() / 1000;
  var dt = lastNow ? Math.min(0.1, now - lastNow) : 0;
  lastNow = now;
  if (!paused) clock += dt;
  if (phase === 'play') {
    render('play', clock);
  } else if (phase === 'intro' || phase === 'dissolve') {
    var it = clock - introT0;
    if (!paused) {
      if (musicT0 < 0) startMusic();
      scheduleMusic(0);
      finaleSound(prevIntroT, it);
      prevIntroT = it;
    }
    if (phase === 'intro' && it >= INTRO_END) { phase = 'dissolve'; treeT0 = clock; prevTreeT = -1; }
    if (phase === 'dissolve') {
      var tt = clock - treeT0;
      if (!paused) { sound(prevTreeT, tt); prevTreeT = tt; }
      render('dissolve', it, tt, smooth(clamp01(tt / DISSOLVE)) * 1.06);
      if (tt >= DISSOLVE) phase = 'tree';
    } else {
      render('intro', it);
    }
  } else {
    var t = clock - treeT0;
    if (!paused) {
      musicHold = t >= HB_T0 - 0.4;
      sound(prevTreeT, t);
      hbSound(prevTreeT, t);
      prevTreeT = t;
    }
    render('tree', 0, t);
    if (phase === 'tree' && t >= HB_END) { phase = 'out'; outT0 = clock; document.getElementById('fadeOut').classList.add('on'); }
    if (phase === 'out' && clock - outT0 > 1.0 && !outGone) { outGone = true; go(); }
  }
  requestAnimationFrame(frame);
}
function resetAll() {
  fired = {}; growStep = -1; leafStep = -1; leafBedOn = false; smStep = -1;
  musicT0 = -1; musicHold = false; fFired = {}; chugStep = -1;
  prevIntroT = -1; prevTreeT = -1; outGone = false;
  document.getElementById('fadeOut').classList.remove('on');
}
function start() {
  initAudio();
  if (AC && AC.state !== 'running' && AC.resume) AC.resume();
  if (started) return;
  started = true;
  resetAll();
  phase = 'intro'; introT0 = clock;
  muteBtn.classList.add('show');
}
function replay() {
  resetAll();
  phase = 'intro'; introT0 = clock; paused = false;
  if (AC && AC.resume) AC.resume();
}
var XMAS_TRACK = 'assets/audio/jingle-bells.mp3';
function go() {
  try {
    localStorage.setItem('currentTrackSrc', XMAS_TRACK);
    localStorage.setItem('musicTime', '0');
    localStorage.setItem('musicPlaying', muted ? 'false' : 'true');
  } catch (e) { }
  window.location.href = NEXT_PAGE;
}
function onTap(e) {
  if (e.target === muteBtn) return;
  if (!started) start();
}
window.addEventListener('pointerdown', onTap);
window.addEventListener('keydown', function (e) {
  if (e.code === 'Enter' || e.code === 'Space') {
    e.preventDefault();
    if (!started) { start(); return; }
    if (e.code === 'Space') {
      paused = !paused;
      if (AC) { if (paused && AC.suspend) AC.suspend(); else if (!paused && AC.resume) AC.resume(); }
    }
  }
  if (e.key === 'r' || e.key === 'R') { if (started) replay(); }
});
window.addEventListener('resize', function () { layout(); });

layout();
requestAnimationFrame(frame);
</script>
